# Builds and tests OrbitDrop on a GitHub Mac runner, so no local machine has to.
# macOS 26 is needed: the wheel and editors use the macOS 26 SDK's Liquid Glass.
name: macOS build and tests

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers
          xcrun swiftc --version
      - name: Offline tests
        run: bash test.sh
      - name: Build the app
        run: bash build.sh
      - name: Check the packaged app
        run: python3 tools/verify-package.py
      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: OrbitDrop-macOS-AppleSilicon
          path: dist/OrbitDrop-macOS-AppleSilicon.zip
